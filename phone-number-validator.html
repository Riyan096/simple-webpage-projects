<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Number Validator</title>
    <style>
        :root {
        --primary-color: #007AFF;
        --valid-color: #34C759;
        --invalid-color: #FF3B30;
        --bg-color: #F2F2F7;
        --screen-color: #FFFFFF;
        --text-color: #1C1C1E;
        --subtext-color: #8E8E93;
        }

        body{
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: linear-gradient(to right, #656B83, #9198e5);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        }

        .smartphone {
        position: relative;
        width: 350px;
        height: 800px;
        background: #000;
        border-radius: 40px;
        padding: 15px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .screen {
        width: 100%;
        height: 100%;
        background: var(--screen-color);
        border-radius: 30px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        }

        .status-bar {
        display: flex;
        justify-content: space-between;
        padding: 10px 20px;
        font-size: 14px;
        font-weight: 600;
        color: var(--text-color);
        }

        .status-icons i {
        margin-left: 8px;
        }

        .app-container {
        flex: 1;
        padding: 20px;
        display: flex;
        flex-direction: column;
        }

        .app-container h1 {
        color: var(--primary-color);
        text-align: center;
        margin-bottom: 30px;
        font-size: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        }

        #user-input {
        background: var(--bg-color);
        border-radius: 15px;
        padding: 20px;
        margin-bottom: 20px;
        font-size: 28px;
        font-weight: 500;
        text-align: right;
        border: none;
        width: calc(100% - 40px);
        }

        #user-input:focus{
        outline: none;
        }

        #check-btn, #clear-btn {
        flex: 1;
        padding: 15px;
        border-radius: 10px;
        font-size: 18px;
        font-weight: 600;
        border: none;
        cursor: pointer;
        transition: all 0.2s;
        }

        #check-btn {
        background-color: var(--valid-color);
        color: white;
        }

        #check-btn:hover{
        background-color: #267f3c;
        }

        #clear-btn {
        background-color: var(--invalid-color);
        color: white;
        }

        #clear-btn:hover {
        background-color: #a82821;
        }

        #check-btn:active, #clear-btn:active {
        transform: scale(0.95);
        }

        .phone-display {
        background: var(--bg-color);
        border-radius: 15px;
        padding: 20px;
        min-height: 60px;
        margin-bottom: 20px;
        font-size: 28px;
        font-weight: 500;
        text-align: right;
        position: relative;
        overflow: hidden;
        }

        .input-text {
        letter-spacing: 1px;
        }

        .cursor {
        animation: blink 1s infinite;
        color: var(--primary-color);
        }

        .colon{
        animation: blink-colon 1.5s infinite;
        }

        @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
        }

        @keyframes blink-colon {
        from { opacity: 1; }
        to { opacity: 0; }
        }

        .validation-result {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 15px;
        margin-bottom: 30px;
        padding: 15px;
        border-radius: 15px;
        background: var(--bg-color);
        opacity: 0;
        transform: translateY(10px);
        transition: all 0.3s ease;
        }

        .validation-result.show {
        opacity: 1;
        transform: translateY(0);
        }

        .result-icon {
        font-size: 24px;
        }

        .result-text {
        font-size: 18px;
        font-weight: 500;
        }

        .keypad {
        margin-top: auto;
        }

        .row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 15px;
        }

        .key {
        width: 70px;
        height: 70px;
        border-radius: 35px;
        background: var(--bg-color);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        font-weight: 500;
        color: var(--text-color);
        border: none;
        cursor: pointer;
        transition: all 0.1s;
        user-select: none;
        }

        .key:hover{
        background: #59595b;
        }

        .key:active {
        transform: scale(0.95);
        background: #D1D1D6;
        }

        .key .subtext {
        font-size: 10px;
        color: var(--subtext-color);
        margin-top: 2px;
        font-weight: 400;
        }

        @media only screen and (max-width: 400px) {
            .key {
                width: 50px;
                height: 50px;
                font-size: 20px;
            }
                        
            .key .subtext {
                font-size: 8px;
            }
                        
            .app {
                padding: 15px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="smartphone">
        <div class="screen">
            <div class="status-bar">
                <span>9<span class="colon">:</span>41</span>
                <div class="status-icons">
                    <i class="fas fa-signal"></i>
                    <i class="fas fa-wifi"></i>
                    <i class="fas fa-battery-full"></i>
                </div>
            </div>
            
            <div class="app-container">
                <h1><i class="fas fa-phone-alt"></i> Number Validator</h1>
                
                <input type="text" id="user-input" placeholder="Enter phone number">
                
                <div id="results-div"></div>
                
                <div class="buttons">
                    <button id="check-btn">Check</button>
                    <button id="clear-btn">Clear</button>
                </div>
                
                <div class="keypad">
                    <div class="row">
                        <button class="key" data-key="1">1<div class="subtext"></div></button>
                        <button class="key" data-key="2">2<div class="subtext">ABC</div></button>
                        <button class="key" data-key="3">3<div class="subtext">DEF</div></button>
                    </div>
                    <div class="row">
                        <button class="key" data-key="4">4<div class="subtext">GHI</div></button>
                        <button class="key" data-key="5">5<div class="subtext">JKL</div></button>
                        <button class="key" data-key="6">6<div class="subtext">MNO</div></button>
                    </div>
                    <div class="row">
                        <button class="key" data-key="7">7<div class="subtext">PQRS</div></button>
                        <button class="key" data-key="8">8<div class="subtext">TUV</div></button>
                        <button class="key" data-key="9">9<div class="subtext">WXYZ</div></button>
                    </div>
                    <div class="row">
                        <button class="key" data-key="*">*</button>
                        <button class="key" data-key="0">0<div class="subtext">+</div></button>
                        <button class="key" data-key="#">#</button>
                    </div>
                    <div class="row">
                        <button class="key" id="backspace-btn"><i class="fas fa-backspace"></i></button>
                        <button class="key" data-key="(">(</i></button>
                        <button class="key" data-key=")">)</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const checkBtn = document.getElementById("check-btn");
        const clearBtn = document.getElementById("clear-btn");
        const userInput = document.getElementById("user-input");
        const result = document.getElementById("results-div");
        const backspaceBtn = document.getElementById('backspace-btn');
        const keys = document.querySelectorAll('.key[data-key]');


        keys.forEach(key => {
        key.addEventListener('click', () => {
            userInput.value += key.getAttribute('data-key');
        });
        });

        backspaceBtn.addEventListener('click', () => {
        userInput.value = userInput.value.slice(0, -1);
        });

        const checkNumber = input => {
        if(input === ""){
            alert("Please provide a phone number");
            return;
        }
        else{
            const regex = /^(1\s?)?[\s\-]?(\(\d{3}\)|\d{3})[\s\-]?\d{3}[\s\-]?\d{4}$/;

            const pTag = document.createElement("p");
            pTag.className = 'results-text';
            regex.test(input) ? (pTag.style.color = '#34C759') : (pTag.style.color = '#77201b');
            pTag.appendChild(
            document.createTextNode(`${regex.test(input) ? 'Valid' : 'Invalid'} US number: ${input}`)
            );
            result.appendChild(pTag);
        }
        };

        checkBtn.addEventListener('click', () => {
        result.textContent = '';
        checkNumber(userInput.value);
        userInput.value = '';
        });

        clearBtn.addEventListener('click', () => {
        result.textContent = '';
        });

        userInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
            result.textContent = '';
            checkNumber(userInput.value);
            userInput.value = '';
        }
        });
    </script>
</body>
</html>
